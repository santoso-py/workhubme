<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="guide.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 14px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: #1d1d1f; }
  .dim { position: fixed; inset: 0; background: rgba(28, 30, 38, .30); display: grid; place-items: center; }
  .card { width: 560px; max-height: calc(100vh - 72px); overflow: auto; box-sizing: border-box; padding: 22px 26px 20px; border-radius: 22px; background: rgba(255, 255, 255, .95); box-shadow: 0 24px 60px rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .9); }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .ver { font-size: 12px; color: #8a8c94; }
  h2.sec { margin: 22px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #8a8c94; }
  .card .guide { margin: 8px 0 0; background: #f6f7fa; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04); }
  .card .guide h2 { display: none; }
  .entry h3 { margin: 0 0 6px; font-size: 13px; font-weight: 650; }
  .entry .date { margin-left: 6px; font-weight: 400; color: #8a8c94; }
  .entry ul { margin: 0 0 6px; padding-left: 18px; line-height: 1.5; color: #2b2d33; font-size: 13px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 12.5px; color: #4a4c54; font-weight: 500; }
  details .entry { margin-top: 10px; }
  .row-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { height: 32px; padding: 0 16px; border: 0; border-radius: 10px; background: #eceef3; color: #2b2d33; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #0a84ff; color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .status { font-size: 13px; color: #2b2d33; }
  .status.good { color: #1a7f37; }
  .status.bad { color: #c4281c; }
  .notes { margin: 10px 0 0; padding: 10px 12px; max-height: 130px; overflow: auto; border-radius: 10px; background: #f6f7fa; font: 12px ui-monospace, 'SF Mono', Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: #3c3e45; }
  .hint { margin: 8px 0 0; font-size: 11.5px; line-height: 1.45; color: #8a8c94; }
  .howto { margin: 10px 0 0; font-size: 12.5px; color: #2b2d33; }
  .hidden { display: none; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .actions .done { background: #0a84ff; color: #fff; }
</style>
<div class="dim" id="dim">
  <div class="card" id="card">
    <header><h1 data-i18n="help.title"></h1><span class="ver" id="ver"></span></header>

    <h2 class="sec" data-i18n="guide.title"></h2>
    <div class="guide"><div id="guideRows"></div></div>

    <h2 class="sec" data-i18n="help.whatsNew"></h2>
    <div id="changelog"></div>

    <h2 class="sec" data-i18n="help.updates"></h2>
    <div class="row-actions"><button id="check" data-i18n="help.check"></button><span class="status" id="status"></span></div>
    <div class="notes hidden" id="notes"></div>
    <p class="howto hidden" id="howto" data-i18n="help.howTo"></p>
    <div class="row-actions hidden" id="releaseRow" style="margin-top:10px"><button class="primary" id="openRelease" data-i18n="help.openRelease"></button></div>
    <p class="hint" data-i18n="help.privacy"></p>

    <div class="actions"><button id="project" data-i18n="help.project"></button><button class="done" id="done" data-i18n="set.done"></button></div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="guide.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let lang = 'en';
  let data = null; // { version, changelog, repoUrl }
  let update = null; // result of the last check, kept only while the sheet is open
  const tr = (key, params) => I18N.t(lang, key, params);
  const itemsFor = (entry) => (entry.items[lang] && entry.items[lang].length ? entry.items[lang] : entry.items.en);

  function entryNode(entry) {
    const box = document.createElement('div');
    box.className = 'entry';
    const h = document.createElement('h3');
    h.textContent = 'v' + entry.version;
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = entry.date;
    h.append(date);
    const ul = document.createElement('ul');
    for (const text of itemsFor(entry)) {
      const li = document.createElement('li');
      li.textContent = text; // plain text only
      ul.append(li);
    }
    box.append(h, ul);
    return box;
  }

  function paintUpdate() {
    const status = $('status');
    status.className = 'status';
    $('notes').classList.add('hidden');
    $('howto').classList.add('hidden');
    $('releaseRow').classList.add('hidden');
    $('check').disabled = false;
    if (!update) { status.textContent = ''; return; }
    if (update.status === 'checking') { status.textContent = tr('help.checking'); $('check').disabled = true; return; }
    if (update.status === 'current') { status.textContent = tr('help.upToDate', { version: update.current }); status.classList.add('good'); return; }
    if (update.status === 'none') { status.textContent = tr('help.none'); return; }
    if (update.status === 'available') {
      status.textContent = tr('help.available', { latest: update.latest, current: update.current });
      status.classList.add('good');
      if (update.notes) { $('notes').textContent = update.notes; $('notes').classList.remove('hidden'); }
      $('howto').classList.remove('hidden');
      $('releaseRow').classList.remove('hidden');
      return;
    }
    status.textContent = tr('help.error');
    status.classList.add('bad');
  }

  function paint() {
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = I18N.t(lang, el.dataset.i18n); });
    document.documentElement.lang = lang;
    Guide.render($('guideRows'), tr);
    if (!data) return;
    $('ver').textContent = tr('help.version', { version: data.version });
    const [latest, ...older] = data.changelog;
    const box = $('changelog');
    box.replaceChildren();
    if (latest) box.append(entryNode(latest));
    if (older.length) {
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = tr('help.older', { count: older.length });
      details.append(summary, ...older.map(entryNode));
      box.append(details);
    }
    paintUpdate();
  }

  // Also called directly by the screenshot and test harnesses.
  function renderHelp(next) { data = next; paint(); }
  async function load() { update = null; renderHelp(await help.get()); }

  $('check').addEventListener('click', async () => {
    update = { status: 'checking' };
    paintUpdate();
    update = await help.check();
    paintUpdate();
  });
  $('openRelease').addEventListener('click', () => help.openRelease());
  $('project').addEventListener('click', () => help.openProject());
  $('done').addEventListener('click', () => help.close());
  $('dim').addEventListener('mousedown', (e) => { if (e.target === $('dim')) help.close(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') help.close(); });
  help.lang().then((l) => { lang = l || 'en'; paint(); });
  help.onLang((l) => { lang = l; paint(); });
  help.onReset(load);
  load();
</script>
