<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 14px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: #1d1d1f; }
  .dim { position: fixed; inset: 0; background: rgba(28, 30, 38, .30); display: grid; place-items: center; }
  .card { width: 460px; box-sizing: border-box; padding: 22px 24px 20px; border-radius: 22px; background: rgba(255, 255, 255, .94); box-shadow: 0 24px 60px rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .9); }
  h1 { margin: 0 0 16px; font-size: 17px; font-weight: 650; }
  .label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: #6b6d75; }
  .seg { display: flex; padding: 3px; border-radius: 11px; background: #eceef3; }
  .seg button { flex: 1; height: 30px; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #4a4c54; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; color: #2b2d33; cursor: pointer; }
  .check input { margin-top: 3px; }
  .hint { margin: 4px 0 0; font-size: 11.5px; color: #8a8c94; line-height: 1.4; }
  .sub { margin-left: 24px; }
  .hidden { display: none; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .actions button.plain { background: #eceef3; color: #2b2d33; }
  .actions button { height: 34px; padding: 0 20px; border-radius: 10px; border: 0; background: #0a84ff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
<div class="dim" id="dim">
  <div class="card">
    <h1 data-i18n="set.title"></h1>

    <span class="label" data-i18n="set.language"></span>
    <div class="seg" id="langs"></div>

    <label class="check"><input type="checkbox" id="swipe"><span><span data-i18n="set.swipe"></span><p class="hint" data-i18n="set.swipeHint"></p></span></label>
    <label class="check sub hidden" id="invertRow"><input type="checkbox" id="invert"><span data-i18n="set.swipeInvert"></span></label>

    <label class="check"><input type="checkbox" id="badges"><span data-i18n="set.badges"></span></label>
    <label class="check sub hidden" id="dockRow"><input type="checkbox" id="dock"><span data-i18n="set.dockBadge"></span></label>

    <div class="actions"><button id="help" class="plain" data-i18n="set.help"></button><button id="done" data-i18n="set.done"></button></div>
  </div>
</div>
<script src="i18n.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let lang = 'en';
  let current = null;

  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = I18N.t(lang, el.dataset.i18n); });
    document.documentElement.lang = lang;
  }

  function render() {
    if (!current) return;
    $('langs').replaceChildren(...Object.entries(current.languages).map(([code, name]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.className = code === current.language ? 'on' : '';
      b.addEventListener('click', () => update({ language: code }));
      return b;
    }));
    $('swipe').checked = current.swipe;
    $('invert').checked = current.swipeInvert;
    $('invertRow').classList.toggle('hidden', !current.swipe);
    $('badges').checked = current.badges;
    $('dock').checked = current.dockBadge;
    $('dockRow').classList.toggle('hidden', !current.badges);
  }

  async function update(patch) {
    const result = await settings.set(patch);
    if (result && result.ok) { current = result.settings; render(); }
  }

  async function load() { current = await settings.get(); render(); }

  $('swipe').addEventListener('change', () => update({ swipe: $('swipe').checked }));
  $('invert').addEventListener('change', () => update({ swipeInvert: $('invert').checked }));
  $('badges').addEventListener('change', () => update({ badges: $('badges').checked }));
  $('dock').addEventListener('change', () => update({ dockBadge: $('dock').checked }));
  $('done').addEventListener('click', () => settings.close());
  $('help').addEventListener('click', () => settings.openHelp());
  $('dim').addEventListener('mousedown', (e) => { if (e.target === $('dim')) settings.close(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') settings.close(); });
  settings.lang().then((l) => { lang = l || 'en'; applyLang(); });
  settings.onLang((l) => { lang = l; applyLang(); });
  settings.onReset(load);
  load();
</script>
